<style>
:root{
  --ink:#10162B;
  --ink-2:#1E2748;
  --paper:#F5F4EF;
  --surface:#FFFFFF;
  --line:#E5E2D8;
  --brass:#B6852E;
  --brass-light:#E9C77B;
  --brass-dim:#F3E6C8;
  --success:#2F7D5B;
  --success-bg:#E6F3EC;
  --warn:#B4680A;
  --warn-bg:#FBEEDC;
  --danger:#B23A32;
  --danger-bg:#FBEAE8;
  --muted:#6E7280;
  --text:#1A2036;
  --radius:14px;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:-0.01em;}
p{margin:0;}
button{font-family:var(--font-body);cursor:pointer;}
input,select,textarea{font-family:var(--font-body);}
::selection{background:var(--brass-light);color:var(--ink);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#d8d4c6;border-radius:8px;}
a{color:inherit;}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}

/* ---------- utility ---------- */
.hidden{display:none !important;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:none;border-radius:10px;padding:11px 18px;font-weight:600;font-size:14px;
  transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--ink);color:#fff;}
.btn-primary:hover{background:var(--ink-2);}
.btn-brass{background:var(--brass);color:#fff;}
.btn-brass:hover{background:#a3762a;}
.btn-outline{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
.btn-outline:hover{border-color:var(--ink);}
.btn-danger{background:var(--danger-bg);color:var(--danger);}
.btn-danger:hover{background:#f6d9d6;}
.btn-ghost{background:transparent;color:var(--muted);padding:8px 10px;}
.btn-ghost:hover{color:var(--ink);}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
.field input,.field select,.field textarea{
  width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;
  font-size:14.5px;background:#fff;color:var(--text);transition:border-color .12s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brass);}
.field-hint{font-size:12px;color:var(--muted);margin-top:5px;}
.field-row{display:flex;gap:12px;}
.field-row .field{flex:1;}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px;letter-spacing:.02em;}
.badge-success{background:var(--success-bg);color:var(--success);}
.badge-warn{background:var(--warn-bg);color:var(--warn);}
.badge-danger{background:var(--danger-bg);color:var(--danger);}
.badge-muted{background:#EEEDE7;color:var(--muted);}
.badge-brass{background:var(--brass-dim);color:#8a621f;}

/* ---------- notch signature shape ---------- */
.notch{clip-path:polygon(0 0,calc(100% - 26px) 0,100% 26px,100% 100%,0 100%);}
.notch-sm{clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%);}

/* ---------- toast ---------- */
#toast-wrap{position:fixed;top:18px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:10px;max-width:340px;}
.toast{
  background:var(--ink);color:#fff;padding:13px 14px;border-radius:11px;font-size:13.5px;font-weight:500;
  display:flex;align-items:flex-start;gap:10px;box-shadow:0 10px 30px rgba(16,22,43,.25);
  animation:toastIn .25s ease;
}
@keyframes toastIn{from{opacity:0;transform:translateX(16px);}to{opacity:1;transform:translateX(0);}}
.toast.success{background:#1c4d38;}
.toast.error{background:#5c2420;}
.toast.warn{background:#5a3c11;}
.toast .t-x{margin-left:auto;background:none;border:none;color:rgba(255,255,255,.7);font-size:15px;line-height:1;cursor:pointer;padding:2px;}
.toast .t-x:hover{color:#fff;}
.toast .t-body{flex:1;}
.toast .t-title{font-weight:700;margin-bottom:2px;}

/* ---------- modal ---------- */
#modal-overlay{
  position:fixed;inset:0;background:rgba(16,20,35,.55);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;z-index:900;padding:20px;
  animation:fadeIn .15s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#modal-box{
  background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;
  box-shadow:0 30px 60px rgba(0,0,0,.3);animation:modalIn .18s ease;
}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--line);}
.modal-head h3{font-size:18px;}
.modal-body{padding:22px;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}

/* ---------- auth screens ---------- */
.auth-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(circle at 15% 15%, #1a2140 0%, #10162B 55%, #0b0f1e 100%);
}
.auth-card{
  width:100%;max-width:920px;display:grid;grid-template-columns:1fr 1fr;background:#fff;border-radius:22px;overflow:hidden;
  box-shadow:0 40px 90px rgba(0,0,0,.45);
}
.auth-side{
  background:linear-gradient(160deg,#141a33,#0b0f1e 75%);color:#fff;padding:48px 40px;display:flex;flex-direction:column;justify-content:space-between;position:relative;
}
.auth-side::after{
  content:"";position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(182,133,46,.25),transparent 70%);
}
.brand-mark{display:flex;align-items:center;gap:12px;}
.brand-mark img{width:38px;height:38px;}
.brand-mark .bt{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:.01em;}
.auth-side h2{font-size:28px;line-height:1.25;margin-top:34px;}
.auth-side p.sub{color:rgba(255,255,255,.65);margin-top:12px;font-size:14px;line-height:1.6;}
.auth-side .quote{position:relative;z-index:1;}
.auth-form{padding:44px 40px;}
.auth-form h2{font-size:23px;margin-bottom:6px;}
.auth-form p.lead{color:var(--muted);font-size:13.5px;margin-bottom:26px;}
.auth-switch{margin-top:18px;text-align:center;font-size:13.5px;color:var(--muted);}
.auth-switch button{background:none;border:none;color:var(--brass);font-weight:700;cursor:pointer;font-size:13.5px;}
@media (max-width:760px){
  .auth-card{grid-template-columns:1fr;}
  .auth-side{display:none;}
}

/* ---------- app shell ---------- */
.app-shell{display:flex;min-height:100vh;}
.sidebar{
  width:250px;flex-shrink:0;background:var(--ink);color:#fff;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.sidebar .brand{display:flex;align-items:center;gap:11px;padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar .brand img{width:32px;height:32px;}
.sidebar .brand .bt{font-family:var(--font-display);font-weight:700;font-size:16px;}
.sidebar .brand .bt small{display:block;font-family:var(--font-body);font-weight:500;font-size:10.5px;color:rgba(255,255,255,.5);letter-spacing:.06em;text-transform:uppercase;margin-top:1px;}
.nav-group{padding:14px 12px;overflow-y:auto;flex:1;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:10px;color:rgba(255,255,255,.68);
  font-size:14px;font-weight:500;margin-bottom:3px;cursor:pointer;transition:background .12s,color .12s;
}
.nav-item svg{width:18px;height:18px;flex-shrink:0;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:var(--brass);color:#fff;font-weight:700;}
.sidebar-foot{padding:14px 16px 18px;border-top:1px solid rgba(255,255,255,.08);}
.user-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;}
.user-avatar{width:34px;height:34px;border-radius:50%;background:var(--brass);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
.user-chip .un{font-size:13px;font-weight:700;line-height:1.2;}
.user-chip .ur{font-size:11px;color:rgba(255,255,255,.5);}
.logout-btn{width:100%;margin-top:10px;background:rgba(255,255,255,.06);color:#fff;border:none;border-radius:9px;padding:9px;font-size:12.5px;font-weight:600;}
.logout-btn:hover{background:rgba(255,255,255,.12);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;padding:16px 26px;background:#fff;
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;
}
.topbar h1{font-size:20px;}
.topbar .clock{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;}
.hamburger{display:none;background:none;border:none;padding:6px;}
.content{padding:26px;flex:1;}
@media (max-width:980px){
  .sidebar{position:fixed;left:0;top:0;z-index:200;transform:translateX(-105%);transition:transform .22s ease;}
  .sidebar.open{transform:translateX(0);}
  .hamburger{display:block;}
  .content{padding:16px;}
  .topbar{padding:12px 16px;}
}
#sidebar-scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:150;}
#sidebar-scrim.show{display:block;}

/* ---------- maba shell ---------- */
.maba-shell{max-width:520px;margin:0 auto;min-height:100vh;background:var(--paper);padding-bottom:90px;}
.maba-top{background:var(--ink);color:#fff;padding:20px 20px 60px;border-radius:0 0 28px 28px;position:relative;overflow:hidden;}
.maba-top::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(182,133,46,.3),transparent 70%);}
.maba-top .row1{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;}
.maba-top .brand-mark img{width:28px;height:28px;}
.maba-clock{margin-top:20px;position:relative;z-index:1;}
.maba-clock .time{font-family:var(--font-display);font-size:38px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;}
.maba-clock .date{font-size:13px;color:rgba(255,255,255,.6);margin-top:6px;}
.maba-body{padding:0 18px;margin-top:-42px;position:relative;z-index:2;}
.qr-hero{
  background:#fff;border-radius:20px;padding:24px;text-align:center;box-shadow:0 18px 40px rgba(16,22,43,.15);
}
.qr-hero .qbox{display:inline-block;padding:14px;border-radius:14px;background:#fff;border:1.5px dashed var(--line);}
.qr-hero .qname{font-family:var(--font-display);font-weight:700;font-size:17px;margin-top:14px;}
.qr-hero .qnim{color:var(--muted);font-size:12.5px;margin-top:2px;}
.maba-status-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:16px;}
.mini-stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 10px;text-align:center;}
.mini-stat .n{font-family:var(--font-display);font-size:20px;font-weight:700;}
.mini-stat .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
.section-title{font-size:14px;font-weight:700;margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;}
.maba-bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;
  border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px 10px;z-index:60;
}
.mnav-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;flex:1;padding:6px 2px;border-radius:10px;}
.mnav-item svg{width:20px;height:20px;}
.mnav-item.active{color:var(--brass);}

/* ---------- tables ---------- */
.table-card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;}
.table-toolbar{display:flex;gap:10px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.table-toolbar input[type=search],.table-toolbar select,.table-toolbar input[type=date]{
  padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:13.5px;
}
.table-toolbar .spacer{flex:1;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{
  text-align:left;padding:11px 16px;background:#FAFAF7;color:var(--muted);font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line);white-space:nowrap;
}
tbody td{padding:12px 16px;border-bottom:1px solid #F0EFE9;vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#FBFAF6;}
.table-empty{padding:50px 20px;text-align:center;color:var(--muted);font-size:13.5px;}
.row-actions{display:flex;gap:6px;}
.icon-btn{background:#F3F2EC;border:none;border-radius:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--ink);}
.icon-btn:hover{background:var(--brass-dim);}
.icon-btn.danger:hover{background:var(--danger-bg);color:var(--danger);}
.avatar-sm{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-right:9px;}
.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;font-size:12.5px;color:var(--muted);}

/* ---------- dashboard ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px;}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;position:relative;overflow:hidden;}
.stat-card .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
.stat-card .ic svg{width:19px;height:19px;}
.stat-card .n{font-family:var(--font-display);font-size:26px;font-weight:700;}
.stat-card .l{font-size:12.5px;color:var(--muted);margin-top:2px;}
.stat-card.hero{background:var(--ink);color:#fff;}
.stat-card.hero .l{color:rgba(255,255,255,.55);}
.dash-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;}
@media (max-width:980px){.stat-grid{grid-template-columns:1fr 1fr;} .dash-grid{grid-template-columns:1fr;}}
@media (max-width:560px){.stat-grid{grid-template-columns:1fr 1fr;}}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;}
.panel h3{font-size:15px;margin-bottom:16px;}
.list-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #F0EFE9;font-size:13.5px;}
.list-row:last-child{border-bottom:none;}

/* ---------- scanner ---------- */
.scan-setup{max-width:480px;}
.scan-stage{
  position:relative;background:#0c1020;border-radius:20px;overflow:hidden;aspect-ratio:1/1;max-width:420px;margin:0 auto;
}
.scan-stage video{width:100%;height:100%;object-fit:cover;}
.scan-frame{position:absolute;inset:12%;pointer-events:none;}
.scan-frame .corner{position:absolute;width:34px;height:34px;border:3px solid var(--brass-light);}
.scan-frame .c1{top:0;left:0;border-right:none;border-bottom:none;}
.scan-frame .c2{top:0;right:0;border-left:none;border-bottom:none;}
.scan-frame .c3{bottom:0;left:0;border-right:none;border-top:none;}
.scan-frame .c4{bottom:0;right:0;border-left:none;border-top:none;}
.scan-line{position:absolute;left:8%;right:8%;height:2px;background:linear-gradient(90deg,transparent,var(--brass-light),transparent);animation:scanmove 2.1s ease-in-out infinite;}
@keyframes scanmove{0%{top:14%}50%{top:86%}100%{top:14%}}
.scan-overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:20px;color:#fff;animation:fadeIn .18s ease;
}
.scan-overlay.ok{background:rgba(47,125,91,.94);}
.scan-overlay.fail{background:rgba(178,58,50,.94);}
.scan-overlay .name{font-family:var(--font-display);font-size:21px;font-weight:700;margin-top:8px;}
.scan-overlay .meta{font-size:13px;margin-top:4px;opacity:.9;}
.scan-overlay svg{width:46px;height:46px;}
.scan-idle{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.55);font-size:13px;flex-direction:column;gap:10px;}

/* ---------- misc ---------- */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap;}
.tab-btn{padding:10px 16px;border:none;background:none;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;}
.tab-btn.active{color:var(--ink);border-color:var(--brass);}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-state svg{width:44px;height:44px;color:var(--line);margin-bottom:12px;}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.page-head h2{font-size:21px;}
.page-head p{color:var(--muted);font-size:13px;margin-top:3px;}
.pill-toggle{display:flex;background:#F0EFE9;border-radius:10px;padding:3px;}
.pill-toggle button{border:none;background:none;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);}
.pill-toggle button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1);}
.print-only{display:none;}
@media print{
  .no-print{display:none !important;}
  .print-only{display:block !important;}
  body{background:#fff;}
}
.detail-card{display:flex;gap:14px;padding:16px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;align-items:center;}
.chk-row{display:flex;align-items:center;gap:8px;font-size:13.5px;}
</style>
</head>

const K = {
  users:'Users', prodi:'Prodi', att:'Absensi', izin:'Izin', sakit:'Sakit',
  backup:'Backup', session:'am_session'
};

let DB = { users:[], prodi:[], att:[], izin:[], sakit:[], backup:[] };
let STATE = { user:null, route:'dashboard', sidebarOpen:false, scanSession:null };

/* ---------- storage helpers (Google Sheets via Apps Script) ---------- */
function sheetsReady(){
  if(!window.__sheetsApiUrl || window.__sheetsApiUrl === "ISI_URL_WEB_APP_DI_SINI"){
    toast('URL Google Sheets belum diisi. Lihat instruksi setup di panduan.','error','Penyimpanan Belum Aktif');
    return false;
  }
  return true;
}
async function dbGet(sheetName, def){
  if(!sheetsReady()) return def;
  try{
    const res = await fetch(`${window.__sheetsApiUrl}?sheet=${encodeURIComponent(sheetName)}`);
    const data = await res.json();
    if(!Array.isArray(data)) return def;
    return data;
  }catch(e){ console.error('sheets get error', sheetName, e); toast('Gagal memuat data dari server.','error'); return def; }
}
async function dbSet(sheetName, val){
  if(!sheetsReady()) return;
  try{
    await fetch(window.__sheetsApiUrl, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ sheet: sheetName, data: val })
    });
  }catch(e){ console.error('sheets set error', sheetName, e); toast('Gagal menyimpan data ke server.','error'); }
}
async function saveDB(part){
  const map = {users:K.users, prodi:K.prodi, att:K.att, izin:K.izin, sakit:K.sakit, backup:K.backup};
  await dbSet(map[part], DB[part]);
}
async function loadAllDB(){
  const [users,prodi,att,izin,sakit,backup] = await Promise.all([
    dbGet(K.users, []), dbGet(K.prodi, []), dbGet(K.att, []),
    dbGet(K.izin, []), dbGet(K.sakit, []), dbGet(K.backup, [])
  ]);
  DB = {users,prodi,att,izin,sakit,backup};
}
/* ---------- sesi login (disimpan lokal per HP, bukan di server) ---------- */
function sessionGet(){
  try{ return JSON.parse(localStorage.getItem(K.session) || 'null'); }catch(e){ return null; }
}
function sessionSet(val){
  try{ localStorage.setItem(K.session, JSON.stringify(val)); }catch(e){ console.error('session save error', e); }
}

/* ---------- utils ---------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function pad(n){ return n.toString().padStart(2,'0'); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function timeStr(d){ d=d||new Date(); return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
function fmtDateHuman(str){
  if(!str) return '-';
  const d = new Date(str+'T00:00:00');
  return d.toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
}
function initials(name){ return (name||'?').trim().split(/\s+/).slice(0,2).map(s=>s[0]).join('').toUpperCase(); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function byId(id){ return document.getElementById(id); }
function qs(sel,root){ return (root||document).querySelector(sel); }
function qsa(sel,root){ return Array.from((root||document).querySelectorAll(sel)); }

function getProdi(id){ return DB.prodi.find(p=>p.id===id); }
function getMasta(id){ return DB.users.find(u=>u.id===id && u.role==='maba'); }
function prodiName(id){ const p=getProdi(id); return p? p.nama : '—'; }

/* ---------- toast ---------- */
function toast(msg, type, title){
  type = type||'info';
  const wrap = byId('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast '+type;
  const icon = type==='success' ? '✓' : type==='error' ? '✕' : type==='warn' ? '!' : 'ℹ';
  el.innerHTML = `<div class="t-body">${title?`<div class="t-title">${esc(title)}</div>`:''}<div>${esc(msg)}</div></div><button class="t-x">✕</button>`;
  wrap.appendChild(el);
  const kill = ()=>{ el.style.transition='opacity .2s'; el.style.opacity='0'; setTimeout(()=>el.remove(),200); };
  el.querySelector('.t-x').onclick = kill;
  setTimeout(kill, 4500);
}

/* ---------- modal ---------- */
function openModal(html){
  byId('modal-box').innerHTML = html;
  byId('modal-overlay').classList.remove('hidden');
}
function closeModal(){
  byId('modal-overlay').classList.add('hidden');
  byId('modal-box').innerHTML = '';
}
byId('modal-overlay').addEventListener('click', e=>{ if(e.target.id==='modal-overlay') closeModal(); });

function confirmDialog(title, msg, onYes){
  openModal(`
    <div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="modal-body"><p style="color:var(--muted);font-size:14px;line-height:1.6;">${esc(msg)}</p></div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeModal()">Batal</button>
      <button class="btn btn-danger" id="confirm-yes">Ya, Lanjutkan</button>
    </div>`);
  byId('confirm-yes').onclick = ()=>{ closeModal(); onYes(); };
}

/* ============================================================
   AUTH
   ============================================================ */
async function seedIfEmpty(){
  if(DB.users.length===0){
    DB.users.push({
      id:uid(), role:'admin', username:'admin', password:'admin123', nama:'Administrator',
      nim:'', prodiId:'', createdAt:Date.now()
    });
    await saveDB('users');
  }
}

async function tryRestoreSession(){
  const sess = sessionGet();
  if(sess && sess.userId){
    const u = DB.users.find(x=>x.id===sess.userId);
    if(u){ STATE.user = u; STATE.route = u.role==='admin' ? 'dashboard' : 'beranda'; }
  }
}

async function doLogin(username, password){
  const u = DB.users.find(x=>x.username.toLowerCase()===username.trim().toLowerCase() && x.password===password);
  if(!u){ toast('Username atau password salah.','error'); return; }
  STATE.user = u;
  STATE.route = u.role==='admin' ? 'dashboard' : 'beranda';
  sessionSet({userId:u.id});
  toast(`Selamat datang, ${u.nama}!`,'success');
  render();
}

async function doLogout(){
  STATE.user = null;
  STATE.route = 'login';
  sessionSet({});
  render();
}

async function doRegister(data){
  if(DB.users.some(u=>u.username.toLowerCase()===data.username.toLowerCase())){
    toast('Username sudah digunakan, pilih username lain.','error'); return false;
  }
  if(DB.users.some(u=>u.role==='maba' && u.nim===data.nim)){
    toast('NIM sudah terdaftar.','error'); return false;
  }
  const u = { id:uid(), role:'maba', username:data.username, password:data.password,
    nama:data.nama, nim:data.nim, prodiId:data.prodiId, createdAt:Date.now() };
  DB.users.push(u);
  await saveDB('users');
  toast('Akun berhasil dibuat. Silakan masuk.','success');
  return true;
}

async function doResetPassword(username, nim, newPass){
  const u = DB.users.find(x=>x.username.toLowerCase()===username.trim().toLowerCase() && x.role==='maba' && x.nim===nim.trim());
  if(!u){ toast('Kombinasi username dan NIM tidak ditemukan.','error'); return false; }
  u.password = newPass;
  await saveDB('users');
  toast('Password berhasil direset. Silakan masuk dengan password baru.','success');
  return true;
}

/* ============================================================

   ============================================================ */
function render(){
  const app = byId('app');
  if(!STATE.user){
    app.innerHTML = renderAuth();
    bindAuthEvents();
    return;
  }
  if(STATE.user.role==='admin'){
    app.innerHTML = renderAdminShell();
    bindAdminEvents();
  }else{
    app.innerHTML = renderMabaShell();
    bindMabaEvents();
  }
}

function forgotFormHTML(){
  return `

  <form id="forgot-form">

    <div class="field"><label>NIM</label><input type="text" name="nim" required></div>
    <div class="field"><label>Password Baru</label><input type="password" name="newpass" required minlength="4"></div>
    <button class="btn btn-primary btn-block" type="submit">Atur Ulang Password</button>

function bindAuthEvents(){
  qsa('[data-go]').forEach(b=> b.onclick = ()=>{ STATE.route = b.dataset.go; render(); });
  const lf = byId('login-form');
  if(lf) lf.onsubmit = e=>{ e.preventDefault(); const f=new FormData(lf); doLogin(f.get('username'), f.get('password')); };
  const rf = byId('register-form');
  if(rf) rf.onsubmit = async e=>{
    e.preventDefault(); const f=new FormData(rf);
    const ok = await doRegister({nama:f.get('nama'),nim:f.get('nim'),prodiId:f.get('prodiId'),username:f.get('username'),password:f.get('password')});
    if(ok){ STATE.route='login'; render(); }
  };
  const ff = byId('forgot-form');
  if(ff) ff.onsubmit = async e=>{
    e.preventDefault(); const f=new FormData(ff);
    const ok = await doResetPassword(f.get('username'), f.get('nim'), f.get('newpass'));
    if(ok){ STATE.route='login'; render(); }
  };
}

function renderAdminContent(){
  switch(STATE.route){
    case 'dashboard': return viewDashboard();
    case 'prodi': return viewProdi();
    case 'masta': return viewMasta();
    case 'absensi': return viewAbsensi();
    case 'izinsakit': return viewIzinSakit(true);
    case 'laporan': return viewLaporan();
    case 'akun': return viewAkun();
    default: return viewDashboard();
  }
}
function bindAdminEvents(){
  qsa('.nav-item[data-route]').forEach(el=>{
    el.onclick = ()=>{ STATE.route = el.dataset.route; STATE.sidebarOpen=false; render(); };
  });
  const hb = byId('btn-hamburger'); if(hb) hb.onclick = ()=>{ STATE.sidebarOpen=!STATE.sidebarOpen; render(); };
  const scrim = byId('sidebar-scrim'); if(scrim) scrim.onclick = ()=>{ STATE.sidebarOpen=false; render(); };
  byId('btn-logout').onclick = ()=> confirmDialog('Keluar Akun','Anda yakin ingin keluar dari Absensi Masta?', doLogout);
  startClock();
  bindContentEvents();
}
function bindContentEvents(){
  switch(STATE.route){
    case 'dashboard': drawDashboardChart(); break;
    case 'prodi': bindProdiEvents(); break;
    case 'masta': bindMastaEvents(); break;
    case 'absensi': bindAbsensiEvents(); break;
    case 'izinsakit': bindIzinSakitEvents(true); break;
    case 'laporan': bindLaporanEvents(); break;
    case 'akun': bindAkunEvents(); break;
  }
}
function refreshAdminContent(){
  const el = byId('admin-content');
  if(el){ el.innerHTML = renderAdminContent(); bindContentEvents(); }
}

let clockTimer = null;
function startClock(){
  if(clockTimer) clearInterval(clockTimer);
  const tick = ()=>{
    const el = byId('topbar-clock');
    const mt = byId('maba-time'); const md = byId('maba-date');
    const now = new Date();
    const t = now.toLocaleTimeString('id-ID');
    const d = now.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    if(el) el.textContent = d+' • '+t;
    if(mt) mt.textContent = t;
    if(md) md.textContent = d;
  };
  tick();
  clockTimer = setInterval(tick, 1000);
}

/* ============================================================
   DASHBOARD
   ============================================================ */
function viewDashboard(){
  const totalMasta = DB.users.filter(u=>u.role==='maba').length;
  const today = todayStr();
  const hadirToday = new Set(DB.att.filter(a=>a.tanggal===today).map(a=>a.mastaId)).size;
  const izinToday = DB.izin.filter(i=>i.tanggal===today).length;
  const sakitToday = DB.sakit.filter(s=>s.tanggal===today).length;
  const tidakHadir = Math.max(totalMasta - hadirToday - izinToday - sakitToday, 0);
  const persen = totalMasta? Math.round((hadirToday/totalMasta)*100) : 0;

  const recentAtt = [...DB.att].sort((a,b)=>b.jamTs-a.jamTs).slice(0,6);
  const recentRows = recentAtt.map(a=>{
    const m = getMasta(a.mastaId);
    return `<div class="list-row"><span><b>${esc(m?m.nama:'—')}</b> · ${esc(sesiLabel(a.sesi))}</span><span class="badge badge-success">${a.jam}</span></div>`;
  }).join('') || `<div class="list-row" style="color:var(--muted);">Belum ada aktivitas absensi.</div>`;

  const pendingReq = [
    ...DB.izin.filter(i=>i.status==='pending').map(i=>({...i,jenis:'Izin'})),
    ...DB.sakit.filter(i=>i.status==='pending').map(i=>({...i,jenis:'Sakit'}))
  ].sort((a,b)=>b.createdAt-a.createdAt).slice(0,6);
  const pendingRows = pendingReq.map(r=>{
    const m = getMasta(r.mastaId);
    return `<div class="list-row"><span><b>${esc(m?m.nama:'—')}</b> · ${r.jenis}</span><span class="badge badge-warn">Menunggu</span></div>`;
  }).join('') || `<div class="list-row" style="color:var(--muted);">Tidak ada pengajuan tertunda.</div>`;

  return `
  <div class="page-head"><div><h2>Ringkasan Hari Ini</h2><p>${fmtDateHuman(today)}</p></div></div>
  <div class="stat-grid">
    <div class="stat-card hero">
      <div class="ic" style="background:rgba(255,255,255,.12);color:#fff;">${ICON.users}</div>
      <div class="n">${totalMasta}</div><div class="l">Total Masta Terdaftar</div>
    </div>
    <div class="stat-card">
      <div class="ic" style="background:var(--success-bg);color:var(--success);">${ICON.check}</div>
      <div class="n">${hadirToday}</div><div class="l">Hadir Hari Ini (${persen}%)</div>
    </div>
    <div class="stat-card">
      <div class="ic" style="background:var(--warn-bg);color:var(--warn);">${ICON.note}</div>
      <div class="n">${izinToday}</div><div class="l">Pengajuan Izin</div>
    </div>
    <div class="stat-card">
      <div class="ic" style="background:var(--danger-bg);color:var(--danger);">${ICON.medkit}</div>
      <div class="n">${sakitToday}</div><div class="l">Pengajuan Sakit</div>
    </div>
  </div>
  <div class="dash-grid">
    <div class="panel">
      <h3>Grafik Kehadiran 7 Hari Terakhir</h3>
      <canvas id="attChart" height="230"></canvas>
    </div>
    <div style="display:flex;flex-direction:column;gap:18px;">
      <div class="panel"><h3>Absensi Terbaru</h3>${recentRows}</div>
      <div class="panel"><h3>Pengajuan Tertunda</h3>${pendingRows}</div>
    </div>
  </div>`;
}
function sesiLabel(s){ return {pagi:'Pagi',siang:'Siang',sore:'Sore'}[s] || s; }
function drawDashboardChart(){
  const canvas = byId('attChart'); if(!canvas || typeof Chart==='undefined') return;
  const labels=[]; const data=[];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    labels.push(d.toLocaleDateString('id-ID',{weekday:'short'}));
    data.push(new Set(DB.att.filter(a=>a.tanggal===ds).map(a=>a.mastaId)).size);
  }
  new Chart(canvas.getContext('2d'), {
    type:'bar',
    data:{ labels, datasets:[{ label:'Masta Hadir', data, backgroundColor:'#B6852E', borderRadius:6, maxBarThickness:36 }]},
    options:{ responsive:true, plugins:{legend:{display:false}}, scales:{ y:{beginAtZero:true, ticks:{precision:0}, grid:{color:'#F0EFE9'}}, x:{grid:{display:false}} } }
  });
}

function prodiTableHTML(filter){
  filter = (filter||'').toLowerCase();
  const rows = DB.prodi.filter(p=> p.nama.toLowerCase().includes(filter) || (p.coach||'').toLowerCase().includes(filter));
  if(!rows.length) return `<div class="table-empty">Belum ada data Prodi/Kelompok.</div>`;
  return `<table><thead><tr><th>Nama Prodi/Kelompok</th><th>Coach</th><th>Jumlah Masta</th><th style="text-align:right;">Aksi</th></tr></thead><tbody>
    ${rows.map(p=>{
      const count = DB.users.filter(u=>u.role==='maba'&&u.prodiId===p.id).length;
      return `<tr><td><b>${esc(p.nama)}</b></td><td>${esc(p.coach||'—')}</td><td>${count} Masta</td>
      <td><div class="row-actions" style="justify-content:flex-end;">
        <button class="icon-btn" data-edit-prodi="${p.id}">${ICON.edit}</button>
        <button class="icon-btn danger" data-del-prodi="${p.id}">${ICON.trash}</button>
      </div></td></tr>`;
    }).join('')}
  </tbody></table>`;
}
function bindProdiEvents(){
  const wrap = byId('prodi-table-wrap');
  wrap.innerHTML = prodiTableHTML('');
  bindProdiRowEvents();
  byId('prodi-search').oninput = e=>{ wrap.innerHTML = prodiTableHTML(e.target.value); bindProdiRowEvents(); };
  byId('btn-add-prodi').onclick = ()=> openProdiForm();
}
function bindProdiRowEvents(){
  qsa('[data-edit-prodi]').forEach(b=> b.onclick=()=> openProdiForm(getProdi(b.dataset.editProdi)));
  qsa('[data-del-prodi]').forEach(b=> b.onclick=()=>{
    const id = b.dataset.delProdi;
    const count = DB.users.filter(u=>u.role==='maba'&&u.prodiId===id).length;
    confirmDialog('Hapus Prodi/Kelompok', count? `Ada ${count} Masta pada Prodi/Kelompok ini. Data Prodi/Kelompok tetap akan dihapus, namun data Masta tidak terhapus.` : 'Yakin ingin menghapus Prodi/Kelompok ini?', async ()=>{
      DB.prodi = DB.prodi.filter(p=>p.id!==id); await saveDB('prodi'); toast('Prodi/Kelompok dihapus.','success'); refreshAdminContent();
    });
  });

function qrPayload(masta){ return 'ABSMASTA:'+masta.id; }
async function openMastaQR(m){
  if(!m) return;
  if(typeof window.QRCode!=='function' || typeof window.JsBarcode==='undefined'){ await window.__libsReadyPromise; }
  openModal(`
    <div class="modal-head"><h3>QR Code — ${esc(m.nama)}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="modal-body" style="text-align:center;">
      <div id="qr-render" style="display:inline-block;padding:16px;background:#fff;border:1.5px dashed var(--line);border-radius:14px;"></div>
      <div style="font-family:var(--font-display);font-weight:700;margin-top:14px;">${esc(m.nama)}</div>
      <div style="color:var(--muted);font-size:12.5px;">NIM ${esc(m.nim)} · ${esc(prodiName(m.prodiId))}</div>
      <div style="margin-top:16px;"><svg id="bc-render"></svg></div>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap;">
        <button class="btn btn-outline btn-sm" id="qr-download">${ICON.download} Unduh QR</button>
        <button class="btn btn-outline btn-sm" id="qr-print">${ICON.print} Cetak</button>
      </div>
    </div>`);
  const holder = byId('qr-render');
  if(window.QRCode){ new QRCode(holder, {text:qrPayload(m), width:190, height:190, colorDark:'#10162B', colorLight:'#ffffff'}); }
  else holder.innerHTML = `<p style="font-size:12px;color:var(--muted);">QR: ${esc(qrPayload(m))}</p>`;
  try{ if(window.JsBarcode) JsBarcode('#bc-render', m.nim, {height:40, width:1.6, fontSize:12, margin:4}); }catch(e){}
  byId('qr-download').onclick = ()=>{
    const img = holder.querySelector('img') || holder.querySelector('canvas');
    if(!img) return;
    const url = img.tagName==='CANVAS' ? img.toDataURL('image/png') : img.src;
    const a = document.createElement('a'); a.href=url; a.download = `QR_${m.nim}_${m.nama}.png`; a.click();
  };
  byId('qr-print').onclick = ()=>{
    const w = window.open('', '_blank');
    const img = holder.querySelector('img') || holder.querySelector('canvas');
    const src = img ? (img.tagName==='CANVAS'?img.toDataURL('image/png'):img.src) : '';
    w.document.write(`<html><head><title>Cetak QR ${esc(m.nama)}</title></head><body style="font-family:sans-serif;text-align:center;padding:40px;">
      <img src="${LOGO_SRC}" style="width:40px;"><h2>${esc(m.nama)}</h2><p>NIM ${esc(m.nim)} — ${esc(prodiName(m.prodiId))}</p>
      <img src="${src}" style="width:220px;"><script>window.print()<\/script></body></html>`);
    w.document.close();
  };
}

let scanState = { active:false, stream:null, paused:false, rafId:null, video:null, canvas:null, ctx:null };

        <h3>Kehadiran Sesi Ini</h3>

      </div>
    </div>
  </div>`;

function bindAbsensiEvents(){
  byId('btn-start-scan').onclick = startScanSession;
  byId('btn-stop-scan').onclick = stopScanSession;
}
function currentScanFilterList(){
  const prodiId = byId('scan-prodi').value, tanggal = byId('scan-date').value, sesi = byId('scan-sesi').value;
  const rows = DB.att.filter(a=>a.tanggal===tanggal && a.sesi===sesi && (prodiId==='ALL' || a.prodiId===prodiId));

}
function refreshSessionList(){
  const el = byId('scan-session-list'); if(!el) return;
  const rows = currentScanFilterList();
  if(!rows.length){ el.innerHTML = `<p style="color:var(--muted);font-size:13.5px;">Belum ada Masta yang absen pada sesi ini.</p>`; return; }
  el.innerHTML = rows.map(a=>{

  }).join('');
}

async function startScanSession(){
  if(!byId('scan-date').value){ toast('Pilih tanggal terlebih dahulu.','error'); return; }
  const btn = byId('btn-start-scan');
  if(typeof window.jsQR!=='function'){
    btn.disabled = true; btn.textContent = 'Memuat pemindai...';
    await window.__libsReadyPromise;
    btn.disabled = false; btn.innerHTML = `${ICON.camera} Mulai Absensi`;
  }
  if(typeof window.jsQR!=='function'){
    toast('Pustaka pemindai QR gagal dimuat dari semua sumber CDN. Periksa koneksi internet lalu muat ulang halaman.','error');
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment', width:{ideal:1280}, height:{ideal:1280} } });
    scanState.stream = stream;
    const video = byId('scan-video'); video.srcObject = stream; await video.play();
    scanState.video = video;
    scanState.canvas = document.createElement('canvas');
    scanState.ctx = scanState.canvas.getContext('2d', {willReadFrequently:true});
    scanState.active = true; scanState.paused = false;
    byId('scan-idle').classList.add('hidden');
    video.classList.remove('hidden');
    byId('scan-frame').classList.remove('hidden');
    byId('btn-start-scan').classList.add('hidden');
    byId('btn-stop-scan').classList.remove('hidden');
    qsa('#absensi-grid select, #absensi-grid input').forEach(el=>el.disabled=true);
    refreshSessionList();
    scanLoop();
  }catch(err){
    toast('Tidak dapat mengakses kamera. Periksa izin kamera pada browser.','error');
  }
}
function stopScanSession(){
  scanState.active = false;
  if(scanState.rafId) cancelAnimationFrame(scanState.rafId);
  if(scanState.stream) scanState.stream.getTracks().forEach(t=>t.stop());
  scanState = { active:false, stream:null, paused:false, rafId:null, video:null, canvas:null, ctx:null };
  refreshAdminContent();
}
function scanLoop(){
  if(!scanState.active) return;
  scanState.rafId = requestAnimationFrame(scanLoop);
  if(scanState.paused) return;
  const video = scanState.video;
  if(!video || video.readyState !== video.HAVE_ENOUGH_DATA) return;
  const canvas = scanState.canvas, ctx = scanState.ctx;
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  let imageData;
  try{ imageData = ctx.getImageData(0,0,canvas.width,canvas.height); }catch(e){ return; }
  const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts:'attemptBoth' });
  if(code && code.data){ handleScanResult(code.data); }
}
async function handleScanResult(payload){
  scanState.paused = true;
  const prodiId = byId('scan-prodi').value, tanggal = byId('scan-date').value, sesi = byId('scan-sesi').value;
  let ok=false, title='', msg='', m=null;

  if(!payload.startsWith('ABSMASTA:')){
    title='QR Tidak Dikenali'; msg='Kode ini bukan QR Absensi Masta yang valid.';
  }else{
    const mastaId = payload.split(':')[1];
    m = getMasta(mastaId);
    if(!m){ title='Data Tidak Ditemukan'; msg='Masta dengan QR ini tidak terdaftar di sistem.'; }
    else if(prodiId!=='ALL' && m.prodiId!==prodiId){ title='Prodi/Kelompok Tidak Sesuai'; msg=`${m.nama} bukan anggota ${prodiName(prodiId)}.`; }
    else{
      const dup = DB.att.find(a=>a.mastaId===m.id && a.tanggal===tanggal && a.sesi===sesi);
      if(dup){ title='Sudah Absen'; msg=`${m.nama} sudah tercatat hadir sesi ${sesiLabel(sesi)} pukul ${dup.jam}.`; }
      else{
        const now = new Date();
        DB.att.push({ id:uid(), mastaId:m.id, prodiId:m.prodiId, tanggal, sesi, jam:timeStr(now), jamTs:now.getTime() });
        await saveDB('att');
        ok=true; title=m.nama; msg=`NIM ${m.nim} · ${sesiLabel(sesi)} · ${timeStr(now)}`;
      }
    }
  }
  renderScanOverlay(ok, title, msg);
  refreshSessionList();
  setTimeout(()=>{
    const res = byId('scan-result'); if(res){ res.classList.add('hidden'); res.innerHTML=''; }
    scanState.paused = false;
  }, 5000);
}
function renderScanOverlay(ok, title, msg){
  const res = byId('scan-result'); if(!res) return;
  res.className = 'scan-overlay ' + (ok?'ok':'fail');
  res.innerHTML = `${ok?ICON.check:ICON.x}<div class="name">${esc(title)}</div><div class="meta">${esc(msg)}</div>`;
}

        ${isAdmin? `<div class="field"><label>Masta</label><select name="mastaId" required>${mastaOpts||'<option value="">Belum ada data Masta</option>'}</select></div>`:''}

        <div class="field" id="izin-alasan-field"><label>Alasan</label><input name="alasan" placeholder="cth. Kepentingan keluarga"></div>
        <div class="field"><label>Keterangan</label><textarea name="keterangan" rows="3" placeholder="Keterangan tambahan"></textarea></div>
        <div class="field" id="sakit-lampiran-field" class="hidden"><label>Lampiran (opsional)</label><input name="lampiran" placeholder="cth. nama file surat dokter"></div>
      </form>
    </div>
    <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">Batal</button><button class="btn btn-primary" id="izinsakit-save">Ajukan</button></div>`);
  const jenisSel = qs('select[name=jenis]', byId('izinsakit-form'));
  const toggleFields = ()=>{
    const isIzin = jenisSel.value==='izin';
    byId('izin-alasan-field').style.display = isIzin?'block':'none';
    byId('sakit-lampiran-field').style.display = isIzin?'none':'block';
  };
  jenisSel.onchange = toggleFields; toggleFields();
  byId('izinsakit-save').onclick = async ()=>{
    const f = new FormData(byId('izinsakit-form'));
    const jenis = f.get('jenis');
    const mastaId = isAdmin ? f.get('mastaId') : STATE.user.id;
    if(!mastaId){ toast('Pilih Masta terlebih dahulu.','error'); return; }
    const tanggal = f.get('tanggal'); if(!tanggal){ toast('Tanggal wajib diisi.','error'); return; }
    const base = { id:uid(), mastaId, tanggal, keterangan:f.get('keterangan')||'', status:'pending', createdAt:Date.now(), createdBy:STATE.user.role };
    if(jenis==='izin'){
      if(!f.get('alasan')){ toast('Alasan wajib diisi.','error'); return; }
      DB.izin.push({...base, alasan:f.get('alasan')}); await saveDB('izin');
    }else{
      DB.sakit.push({...base, lampiran:f.get('lampiran')||''}); await saveDB('sakit');
    }
    closeModal(); toast('Pengajuan berhasil dikirim.','success');
    if(onDone) onDone(); else refreshAdminContent();
  };
}

/* ============================================================
   LAPORAN
   ============================================================ */
function viewLaporan(){
  return `
  <div class="page-head"><div><h2>Laporan</h2><p>Rekap kehadiran harian dan bulanan seluruh Masta.</p></div></div>
  <div class="pill-toggle" style="width:fit-content;margin-bottom:18px;">
    <button class="active" data-rtab="harian">Harian</button><button data-rtab="bulanan">Bulanan</button>
  </div>
  <div id="laporan-content"></div>`;
}
function laporanHarianHTML(tanggal){
  const mastaList = DB.users.filter(u=>u.role==='maba');
  const rows = mastaList.map(m=>{
    const att = DB.att.find(a=>a.mastaId===m.id && a.tanggal===tanggal);
    const izin = DB.izin.find(i=>i.mastaId===m.id && i.tanggal===tanggal);
    const sakit = DB.sakit.find(s=>s.mastaId===m.id && s.tanggal===tanggal);
    let status='Tidak Hadir', cls='badge-danger';
    if(att){status='Hadir ('+sesiLabel(att.sesi)+')'; cls='badge-success';}
    else if(izin){status='Izin'; cls='badge-warn';}
    else if(sakit){status='Sakit'; cls='badge-muted';}
    return {m, status, cls, jam: att?att.jam:'-'};
  });
  const hadir = rows.filter(r=>r.cls==='badge-success').length;
  const izinC = rows.filter(r=>r.status==='Izin').length;
  const sakitC = rows.filter(r=>r.status==='Sakit').length;
  const alfa = rows.filter(r=>r.status==='Tidak Hadir').length;
  return `
  <div style="display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;" class="no-print">
    <input type="date" id="lap-tanggal" value="${tanggal}">
    <div class="spacer"></div>
    <button class="btn btn-outline btn-sm" id="lap-print">${ICON.print} Cetak</button>
    <button class="btn btn-outline btn-sm" id="lap-csv">${ICON.download} Unduh Excel (CSV)</button>
  </div>
  <div class="stat-grid" style="grid-template-columns:repeat(4,1fr);">
    <div class="stat-card"><div class="ic" style="background:var(--success-bg);color:var(--success);">${ICON.check}</div><div class="n">${hadir}</div><div class="l">Hadir</div></div>
    <div class="stat-card"><div class="ic" style="background:var(--warn-bg);color:var(--warn);">${ICON.note}</div><div class="n">${izinC}</div><div class="l">Izin</div></div>
    <div class="stat-card"><div class="ic" style="background:#EEEDE7;color:var(--muted);">${ICON.medkit}</div><div class="n">${sakitC}</div><div class="l">Sakit</div></div>
    <div class="stat-card"><div class="ic" style="background:var(--danger-bg);color:var(--danger);">${ICON.x}</div><div class="n">${alfa}</div><div class="l">Tidak Hadir</div></div>
  </div>
  <div class="table-card">
    <table><thead><tr><th>NIM</th><th>Nama</th><th>Prodi/Kelompok</th><th>Status</th><th>Jam</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${esc(r.m.nim)}</td><td>${esc(r.m.nama)}</td><td>${esc(prodiName(r.m.prodiId))}</td><td><span class="badge ${r.cls}">${r.status}</span></td><td>${r.jam}</td></tr>`).join('') || `<tr><td colspan="5" class="table-empty">Belum ada data Masta.</td></tr>`}
    </tbody></table>
  </div>`;
}
function laporanBulananHTML(ym){
  const [year, month] = ym.split('-').map(Number);
  const mastaList = DB.users.filter(u=>u.role==='maba');
  const rows = mastaList.map(m=>{
    const hadir = DB.att.filter(a=>a.mastaId===m.id && a.tanggal.startsWith(ym)).length;
    const izin = DB.izin.filter(i=>i.mastaId===m.id && i.tanggal.startsWith(ym)).length;
    const sakit = DB.sakit.filter(s=>s.mastaId===m.id && s.tanggal.startsWith(ym)).length;
    return {m, hadir, izin, sakit};
  });
  return `
  <div style="display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;" class="no-print">
    <input type="month" id="lap-bulan" value="${ym}">
    <div class="spacer"></div>
    <button class="btn btn-outline btn-sm" id="lap-print2">${ICON.print} Cetak</button>
    <button class="btn btn-outline btn-sm" id="lap-csv2">${ICON.download} Unduh Excel (CSV)</button>
  </div>
  <div class="table-card">
    <table><thead><tr><th>NIM</th><th>Nama</th><th>Prodi/Kelompok</th><th>Total Hadir</th><th>Total Izin</th><th>Total Sakit</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${esc(r.m.nim)}</td><td>${esc(r.m.nama)}</td><td>${esc(prodiName(r.m.prodiId))}</td><td>${r.hadir}</td><td>${r.izin}</td><td>${r.sakit}</td></tr>`).join('') || `<tr><td colspan="6" class="table-empty">Belum ada data Masta.</td></tr>`}
    </tbody></table>
  </div>`;
}
function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url);
}
function bindLaporanEvents(){
  let mode='harian';
  const el = byId('laporan-content');
  const renderMode = ()=>{
    if(mode==='harian'){
      el.innerHTML = laporanHarianHTML(todayStr());
      byId('lap-tanggal').onchange = e=>{ el.innerHTML = laporanHarianHTML(e.target.value); bindHarianButtons(); };
      bindHarianButtons();
    }else{
      const now=new Date(); const ym = now.getFullYear()+'-'+pad(now.getMonth()+1);
      el.innerHTML = laporanBulananHTML(ym);
      byId('lap-bulan').onchange = e=>{ el.innerHTML = laporanBulananHTML(e.target.value); bindBulananButtons(); };
      bindBulananButtons();
    }
  };
  function bindHarianButtons(){
    byId('lap-print').onclick = ()=> window.print();
    byId('lap-csv').onclick = ()=>{
      const tanggal = byId('lap-tanggal').value;
      const mastaList = DB.users.filter(u=>u.role==='maba');
      const data = [['NIM','Nama','Prodi/Kelompok','Status','Jam']];
      mastaList.forEach(m=>{
        const att = DB.att.find(a=>a.mastaId===m.id && a.tanggal===tanggal);
        const izin = DB.izin.find(i=>i.mastaId===m.id && i.tanggal===tanggal);
        const sakit = DB.sakit.find(s=>s.mastaId===m.id && s.tanggal===tanggal);
        let status='Tidak Hadir'; if(att) status='Hadir ('+sesiLabel(att.sesi)+')'; else if(izin) status='Izin'; else if(sakit) status='Sakit';
        data.push([m.nim, m.nama, prodiName(m.prodiId), status, att?att.jam:'-']);
      });
      downloadCSV('Laporan_Harian_'+tanggal+'.csv', data);
    };
  }
  function bindBulananButtons(){
    byId('lap-print2').onclick = ()=> window.print();
    byId('lap-csv2').onclick = ()=>{
      const ym = byId('lap-bulan').value;
      const mastaList = DB.users.filter(u=>u.role==='maba');
      const data = [['NIM','Nama','Prodi/Kelompok','Total Hadir','Total Izin','Total Sakit']];
      mastaList.forEach(m=>{
        const hadir = DB.att.filter(a=>a.mastaId===m.id && a.tanggal.startsWith(ym)).length;
        const izin = DB.izin.filter(i=>i.mastaId===m.id && i.tanggal.startsWith(ym)).length;
        const sakit = DB.sakit.filter(s=>s.mastaId===m.id && s.tanggal.startsWith(ym)).length;
        data.push([m.nim, m.nama, prodiName(m.prodiId), hadir, izin, sakit]);
      });
      downloadCSV('Laporan_Bulanan_'+ym+'.csv', data);
    };
  }
  qsa('[data-rtab]').forEach(b=> b.onclick=()=>{ mode=b.dataset.rtab; qsa('[data-rtab]').forEach(x=>x.classList.remove('active')); b.classList.add('active'); renderMode(); });
  renderMode();
}

/* ============================================================
   MANAJEMEN AKUN (admin only)
   ============================================================ */
function viewAkun(){
  return `
  <div class="page-head"><div><h2>Manajemen Akun</h2><p>Cadangan informasi akun aplikasi — hanya dapat diakses oleh Admin.</p></div>
    <button class="btn btn-brass" id="btn-add-backup">${ICON.plus} Tambah Catatan Akun</button></div>
  <div class="panel" style="margin-bottom:18px;">
    <h3>Akun Admin Aktif</h3>
    <table><thead><tr><th>Nama</th><th>Username</th><th>Password</th></tr></thead><tbody>
      ${DB.users.filter(u=>u.role==='admin').map(u=>`<tr><td>${esc(u.nama)}</td><td>${esc(u.username)}</td><td><span class="pw-mask" data-pw="${esc(u.password)}">••••••••</span></td></tr>`).join('')}
    </tbody></table>
  </div>
  <div class="table-card">
    <div class="table-toolbar"><b style="font-size:13.5px;">Catatan Akun Cadangan</b><div class="spacer"></div></div>
    <div id="backup-table-wrap"></div>
  </div>`;
}
function backupTableHTML(){
  if(!DB.backup.length) return `<div class="table-empty">Belum ada catatan akun cadangan. Gunakan ini sebagai referensi bila lupa akun (mis. akun Google yang dipakai aplikasi).</div>`;
  return `<table><thead><tr><th>Label</th><th>Email/Username</th><th>Password</th><th>Catatan</th><th style="text-align:right;">Aksi</th></tr></thead><tbody>
    ${DB.backup.map(b=>`<tr>
      <td><b>${esc(b.label)}</b></td><td>${esc(b.akun)}</td>
      <td><span class="pw-mask" data-pw="${esc(b.password)}">••••••••</span></td>
      <td>${esc(b.catatan||'—')}</td>
      <td><div class="row-actions" style="justify-content:flex-end;"><button class="icon-btn danger" data-del-backup="${b.id}">${ICON.trash}</button></div></td>
    </tr>`).join('')}
  </tbody></table>`;
}
function bindAkunEvents(){
  byId('backup-table-wrap').innerHTML = backupTableHTML();
  bindAkunRowEvents();
  byId('btn-add-backup').onclick = openBackupForm;
}
function bindAkunRowEvents(){
  qsa('.pw-mask').forEach(el=>{
    el.style.cursor='pointer';
    el.title='Klik untuk lihat/sembunyikan';
    el.onclick = ()=>{ el.textContent = el.textContent==='••••••••' ? el.dataset.pw : '••••••••'; };
  });
  qsa('[data-del-backup]').forEach(b=> b.onclick=()=>{
    confirmDialog('Hapus Catatan','Yakin ingin menghapus catatan akun ini?', async ()=>{
      DB.backup = DB.backup.filter(x=>x.id!==b.dataset.delBackup); await saveDB('backup');
      toast('Catatan dihapus.','success'); refreshAdminContent();
    });
  });
}
function openBackupForm(){
  openModal(`
    <div class="modal-head"><h3>Tambah Catatan Akun</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <form id="backup-form">
        <div class="field"><label>Label</label><input name="label" required placeholder="cth. Akun Google Panitia"></div>
        <div class="field"><label>Email / Username</label><input name="akun" required></div>
        <div class="field"><label>Password</label><input name="password" required></div>
        <div class="field"><label>Catatan</label><textarea name="catatan" rows="2" placeholder="Opsional"></textarea></div>
      </form>
    </div>
    <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">Batal</button><button class="btn btn-primary" id="backup-save">Simpan</button></div>`);
  byId('backup-save').onclick = async ()=>{
    const f = new FormData(byId('backup-form'));
    if(!f.get('label')||!f.get('akun')||!f.get('password')){ toast('Lengkapi data wajib.','error'); return; }
    DB.backup.push({id:uid(), label:f.get('label'), akun:f.get('akun'), password:f.get('password'), catatan:f.get('catatan')||''});
    await saveDB('backup'); closeModal(); toast('Catatan akun tersimpan.','success'); refreshAdminContent();
  };
}

/* ============================================================
   MABA SHELL
   ============================================================ */
const MABA_NAV = [
  {id:'beranda', label:'Beranda', icon:ICON.home},
  {id:'riwayat', label:'Riwayat', icon:ICON.history},
  {id:'izinsakit', label:'Izin/Sakit', icon:ICON.medkit},
  {id:'profil', label:'Profil', icon:ICON.user},
];
function renderMabaShell(){
  const u = STATE.user;
  const navHtml = MABA_NAV.map(n=>`<div class="mnav-item ${STATE.route===n.id?'active':''}" data-route="${n.id}">${n.icon}<span>${n.label}</span></div>`).join('');
  return `
  <div class="maba-shell">
    <div class="maba-top">
      <div class="row1">
        <div class="brand-mark"><img src="${LOGO_SRC}"><span style="font-family:var(--font-display);font-weight:700;">ABSENSI MASTA</span></div>
        <button class="icon-btn" id="maba-logout" style="background:rgba(255,255,255,.12);color:#fff;">${ICON.logout}</button>
      </div>
      <div class="maba-clock"><div class="time" id="maba-time"></div><div class="date" id="maba-date"></div></div>
    </div>
    <div class="maba-body" id="maba-content">${renderMabaContent()}</div>
    <div class="maba-bottom-nav">${navHtml}</div>
  </div>`;
}
function renderMabaContent(){
  switch(STATE.route){
    case 'beranda': return viewMabaBeranda();
    case 'riwayat': return viewMabaRiwayat();
    case 'izinsakit': return viewIzinSakit(false);
    case 'profil': return viewMabaProfil();
    default: return viewMabaBeranda();
  }
}
function bindMabaEvents(){
  qsa('.mnav-item[data-route]').forEach(el=> el.onclick=()=>{ STATE.route=el.dataset.route; render(); });
  byId('maba-logout').onclick = ()=> confirmDialog('Keluar Akun','Anda yakin ingin keluar?', doLogout);
  startClock();
  bindMabaContentEvents();
}
function bindMabaContentEvents(){
  switch(STATE.route){
    case 'beranda': renderMabaQR(); break;
    case 'izinsakit': bindIzinSakitEvents(false); break;
  }
}
function refreshMabaContent(){
  const el = byId('maba-content');
  if(el){ el.innerHTML = renderMabaContent(); bindMabaContentEvents(); }
}
function viewMabaBeranda(){
  const u = STATE.user;
  const today = todayStr();
  const todaySessions = DB.att.filter(a=>a.mastaId===u.id && a.tanggal===today);
  const totalHadir = DB.att.filter(a=>a.mastaId===u.id).length;
  const totalIzin = DB.izin.filter(i=>i.mastaId===u.id).length;
  const totalSakit = DB.sakit.filter(s=>s.mastaId===u.id).length;
  return `
  <div class="qr-hero">
    <div class="qbox" id="maba-qr-box"></div>
    <div class="qname">${esc(u.nama)}</div>
    <div class="qnim">NIM ${esc(u.nim)} · ${esc(prodiName(u.prodiId))}</div>
  </div>
  <div class="maba-status-row">
    <div class="mini-stat"><div class="n">${totalHadir}</div><div class="l">Hadir</div></div>
    <div class="mini-stat"><div class="n">${totalIzin}</div><div class="l">Izin</div></div>
    <div class="mini-stat"><div class="n">${totalSakit}</div><div class="l">Sakit</div></div>
  </div>
  <div class="section-title">Status Absensi Hari Ini</div>
  ${['pagi','siang','sore'].map(s=>{
    const rec = todaySessions.find(a=>a.sesi===s);
    return `<div class="list-row card" style="padding:12px 14px;margin-bottom:8px;border-radius:12px;">
      <span>${sesiLabel(s)}</span>
      ${rec? `<span class="badge badge-success">Hadir · ${rec.jam}</span>` : `<span class="badge badge-muted">Belum Absen</span>`}
    </div>`;
  }).join('')}
  `;
}
async function renderMabaQR(){
  const box = byId('maba-qr-box'); if(!box) return;
  box.innerHTML = `<p style="font-size:12px;color:var(--muted);padding:40px 0;">Memuat QR...</p>`;
  if(typeof window.QRCode!=='function'){ await window.__libsReadyPromise; }
  if(!byId('maba-qr-box')) return; /* view may have changed while waiting */
  box.innerHTML='';
  if(typeof window.QRCode==='function') new QRCode(box, {text:qrPayload(STATE.user), width:170, height:170, colorDark:'#10162B', colorLight:'#ffffff'});
  else box.innerHTML = `<p style="font-size:12px;color:var(--muted);">QR tidak dapat dimuat. Periksa koneksi internet.</p>`;
}
function viewMabaRiwayat(){
  const u = STATE.user;
  const rows = DB.att.filter(a=>a.mastaId===u.id).sort((a,b)=>b.jamTs-a.jamTs);
  if(!rows.length) return `<div class="section-title">Riwayat Absensi</div><div class="empty-state">${ICON.history}<p>Belum ada riwayat absensi.</p></div>`;
  return `<div class="section-title">Riwayat Absensi</div>` + rows.map(r=>`
    <div class="detail-card">
      <div style="width:38px;height:38px;border-radius:10px;background:var(--success-bg);color:var(--success);display:flex;align-items:center;justify-content:center;">${ICON.check}</div>
      <div style="flex:1;">
        <div style="font-weight:700;font-size:13.5px;">${sesiLabel(r.sesi)} · ${fmtDateHuman(r.tanggal)}</div>
        <div style="font-size:12px;color:var(--muted);">Jam masuk ${r.jam}</div>
      </div>
      <span class="badge badge-success">Hadir</span>
    </div>`).join('');
}
function viewMabaProfil(){
  const u = STATE.user;
  return `
  <div class="section-title">Profil Akun</div>
  <div class="panel">
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px;">
      <div class="user-avatar" style="width:52px;height:52px;font-size:18px;">${initials(u.nama)}</div>
      <div><div style="font-weight:700;font-family:var(--font-display);">${esc(u.nama)}</div><div style="color:var(--muted);font-size:12.5px;">Masta</div></div>
    </div>
    <div class="field"><label>NIM</label><input value="${esc(u.nim)}" disabled></div>
    <div class="field"><label>Prodi/Kelompok</label><input value="${esc(prodiName(u.prodiId))}" disabled></div>
    <div class="field"><label>Username</label><input value="${esc(u.username)}" disabled></div>
    <button class="btn btn-outline btn-block" id="btn-change-pass">Ubah Password</button>
  </div>`;
}
document.addEventListener('click', e=>{
  if(e.target && e.target.id==='btn-change-pass'){
    openModal(`
    <div class="modal-head"><h3>Ubah Password</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <form id="chpass-form">
        <div class="field"><label>Password Saat Ini</label><input type="password" name="old" required></div>
        <div class="field"><label>Password Baru</label><input type="password" name="new" required minlength="4"></div>
      </form>
    </div>
    <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">Batal</button><button class="btn btn-primary" id="chpass-save">Simpan</button></div>`);
    byId('chpass-save').onclick = async ()=>{
      const f = new FormData(byId('chpass-form'));
      if(f.get('old')!==STATE.user.password){ toast('Password saat ini salah.','error'); return; }
      STATE.user.password = f.get('new'); await saveDB('users'); closeModal(); toast('Password berhasil diubah.','success');
    };
  }
});

/* ============================================================
   INIT
   ============================================================ */
async function init(){
  await loadAllDB();
  await seedIfEmpty();
  await tryRestoreSession();
  render();
}
init();
</script>
