  return `<div class="section-title">Riwayat Absensi</div>` + rows.map(r=>`
    <div class="detail-card">
      <div style="width:38px;height:38px;border-radius:10px;background:var(--success-bg);color:var(--success);display:flex;align-items:center;justify-content:center;">${ICON.check}</div>
      <div style="flex:1;">
        <div style="font-weight:700;font-size:13.5px;">${sesiLabel(r.sesi)} · ${fmtDateHuman(r.tanggal)}</div>
        <div style="font-size:12px;color:var(--muted);">Jam masuk ${r.jam}</div>
      </div>
      <span class="badge badge-success">Hadir</span>
    </div>`).join('');
}
function viewMabaProfil(){
  const u = STATE.user;
  const kelompokOpts = DB.kelompok.map(k=>`<option value="${k.id}" ${u.kelompokId===k.id?'selected':''}>${esc(k.nama)}</option>`).join('');
  const coachOpts = DB.users.filter(c=>c.role==='coach' && c.active!==false && (!c.prodiId || c.prodiId===u.prodiId))
    .map(c=>`<option value="${c.id}" ${u.coachId===c.id?'selected':''}>${esc(c.nama)}</option>`).join('');
  return `
  <div class="section-title">Profil Akun</div>
  <div class="panel">
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px;">
      <div class="user-avatar" style="width:52px;height:52px;font-size:18px;">${initials(u.nama)}</div>
      <div><div style="font-weight:700;font-family:var(--font-display);">${esc(u.nama)}</div><div style="color:var(--muted);font-size:12.5px;">Masta</div></div>
    </div>
    <div class="field"><label>NIM</label><input value="${esc(u.nim)}" disabled></div>
    <div class="field"><label>Nomor HP</label><input value="${esc(u.noHp||'—')}" disabled></div>
    <div class="field"><label>Prodi</label><input value="${esc(prodiName(u.prodiId))}" disabled></div>
    <form id="username-form">
      <div class="field"><label>Username</label><input type="text" name="username" value="${esc(u.username)}" required minlength="3" autocomplete="off"></div>
      <button class="btn btn-primary btn-block" type="submit">Simpan Username</button>
    </form>
    <button class="btn btn-outline btn-block" id="btn-change-pass" style="margin-top:10px;">Ubah Password</button>
  </div>
  <div class="section-title" style="margin-top:22px;">Kelompok &amp; Coach</div>
  <div class="panel">
    <p class="field-hint" style="margin-bottom:14px;">Pilih Kelompok dan Coach pembimbingmu sendiri. Bisa diubah kapan saja.</p>
    <form id="coach-select-form">
      <div class="field"><label>Kelompok</label><select name="kelompokId">
        <option value="">${kelompokOpts.length? 'Pilih Kelompok' : 'Belum ada data Kelompok'}</option>${kelompokOpts}
      </select></div>
      <div class="field"><label>Coach</label><select name="coachId">
        <option value="">${coachOpts.length? 'Pilih Coach' : 'Belum ada Coach untuk Prodi ini'}</option>${coachOpts}
      </select></div>
      <button class="btn btn-primary btn-block" type="submit">Simpan Kelompok &amp; Coach</button>
    </form>
  </div>`;
}
function bindMabaProfilEvents(){
  const f = byId('coach-select-form');
  if(f){
    f.onsubmit = async e=>{
      e.preventDefault();
      const fd = new FormData(f);
      STATE.user.kelompokId = fd.get('kelompokId') || '';
      STATE.user.coachId = fd.get('coachId') || '';
      await saveDB('users');
      toast('Kelompok & Coach berhasil disimpan.','success');
      refreshMabaContent();
    };
  }
  const uf = byId('username-form');
  if(uf){
    uf.onsubmit = async e=>{
      e.preventDefault();
      const fd = new FormData(uf);
      const newUsername = (fd.get('username')||'').trim();
      if(!newUsername){ toast('Username tidak boleh kosong.','error'); return; }
      if(newUsername.toLowerCase()===STATE.user.username.toLowerCase()){ toast('Username tidak berubah.','info'); return; }
      if(DB.users.some(x=>x.id!==STATE.user.id && x.username.toLowerCase()===newUsername.toLowerCase())){
        toast('Username sudah digunakan, pilih username lain.','error'); return;
      }
      STATE.user.username = newUsername;
      await saveDB('users');
      toast('Username berhasil diubah.','success');
      refreshMabaContent();
    };
  }
}
document.addEventListener('click', e=>{
  if(e.target && e.target.id==='btn-change-pass'){
    openModal(`
    <div class="modal-head"><h3>Ubah Password</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <form id="chpass-form">
        <div class="field"><label>Password Saat Ini</label><input type="password" name="old" required></div>
        <div class="field"><label>Password Baru</label><input type="password" name="new" required minlength="4"></div>
      </form>
    </div>
    <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">Batal</button><button class="btn btn-primary" id="chpass-save">Simpan</button></div>`);
    byId('chpass-save').onclick = async ()=>{
      const f = new FormData(byId('chpass-form'));
      if(f.get('old')!==STATE.user.password){ toast('Password saat ini salah.','error'); return; }
      STATE.user.password = f.get('new'); await saveDB('users'); closeModal(); toast('Password berhasil diubah.','success');
    };
  }
});

/* ============================================================
   AUTO-REFRESH (sinkronisasi berkala tanpa reload manual)
   ============================================================ */
function isSafeToAutoRefresh(){
  const overlay = byId('modal-overlay');
  if(overlay && !overlay.classList.contains('hidden')) return false; /* modal/form sedang terbuka */
  if(typeof scanState!=='undefined' && scanState.active) return false; /* sesi scan QR aktif */
  const ae = document.activeElement;
  if(ae && ['INPUT','TEXTAREA','SELECT'].includes(ae.tagName)) return false; /* pengguna sedang mengetik/memilih */
  return true;
}
function refreshCurrentContent(){
  if(!STATE.user) return;
  if(STATE.user.role==='admin') refreshAdminContent();
  else refreshMabaContent();
}
let autoRefreshTimer = null;
function startAutoRefresh(){
  if(autoRefreshTimer) clearInterval(autoRefreshTimer);
  autoRefreshTimer = setInterval(async ()=>{
    if(!STATE.user) return;
    if(!isSafeToAutoRefresh()) return;
    try{
      await loadAllDB(true);
      const fresh = DB.users.find(x=>x.id===STATE.user.id);
      if(!fresh){ return; }
      STATE.user = fresh;
      if(!isSafeToAutoRefresh()) return; /* cek ulang; state bisa berubah selama fetch */
      refreshCurrentContent();
    }catch(e){ console.error('auto-refresh error', e); }
  }, 45000);
}
/* ============================================================
   INIT
   ============================================================ */
async function init(){
  await loadAllDB();
  await seedIfEmpty();
  await tryRestoreSession();
  render();
  startAutoRefresh();
}
function cardifyTables(root){
  if(!root) return;
  root.querySelectorAll('table').forEach(table=>{
    const headers = Array.from(table.querySelectorAll('thead th')).map(th=>th.textContent.trim());
    if(!headers.length) return;
    table.querySelectorAll('tbody tr').forEach(tr=>{
      Array.from(tr.children).forEach((td,i)=>{
        if(headers[i]) td.setAttribute('data-label', headers[i]);
      });
    });
  });
}
const _cardifyObserver = new MutationObserver(()=>{
  cardifyTables(document.getElementById('app'));
  cardifyTables(document.getElementById('modal-box'));
});
_cardifyObserver.observe(document.getElementById('app'), {childList:true, subtree:true});
_cardifyObserver.observe(document.getElementById('modal-box'), {childList:true, subtree:true});
init();
</script>
